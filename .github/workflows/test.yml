name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # 手動実行を許可

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # import/no-cycle はローカルの lint では無効化しているため、循環参照はここでのみ検出される
      - name: Lint (循環参照チェック込み)
        run: pnpm run lint:cycle

      - name: Format check
        run: pnpm run format:check

      # tsconfig.json は .next/types を include するため、型検査の前にルート型を生成する。
      # next build は不要（typegen は数秒で終わる）。
      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm run typecheck

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # pnpm のバージョンは package.json の packageManager から解決される
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck tests
        run: pnpm run typecheck:test

      - name: Run unit tests
        run: pnpm run test

  server:
    name: DB / Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # config.toml の [auth.external.google] は enabled = true で env() を参照するため、
      # 未設定だと gotrue が起動に失敗しうる。ローカルスタック専用のダミー値を渡す
      # （認証フローの検証には使わないため、秘密情報ではない）。
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: local-ci-client-id
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET: local-ci-client-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # テストが使わないサービスを除外して起動時間を削る。
      # 起動済みスタックを prepare が検出するため、prepare 側は reset と接続情報の生成だけを行う。
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime > /dev/null

      # スキーマ由来の生成物が migration に追従しているかを検証する。
      # ここで落ちる場合はローカルで `pnpm run db:generate` を実行してコミットする。
      - name: Verify generated artifacts
        run: |
          pnpm run db:generate
          git diff --exit-code types/database.ts local_schema.sql

      # prepare（migrations + seed の reset、接続情報の生成）を経由して db / integration を実行する。
      # Supabase の秘密情報は CI に設定せず、すべてローカルスタックから取得する。
      - name: Run db / integration tests
        run: pnpm run test:server
